<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="topFace" x1="16" y1="12" x2="48" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="12" y1="32" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="32" y1="32" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded plate -->
  <rect width="64" height="64" rx="14" fill="#090d16"/>
  <rect width="64" height="64" rx="14" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle Blueprint Grid lines -->
  <path d="M8 20h48M8 32h48M8 44h48M20 8v48M32 8v48M44 8v48" stroke="#1e293b" stroke-width="0.75" stroke-dasharray="2 2"/>

  <!-- 3D Isometric Cube -->
  <g filter="url(#glow)">
    <!-- Top Face -->
    <path d="M32 14 L50 24 L32 34 L14 24 Z" fill="url(#topFace)"/>
    <!-- Left Face -->
    <path d="M14 24 L32 34 L32 50 L14 40 Z" fill="url(#leftFace)"/>
    <!-- Right Face -->
    <path d="M32 34 L50 24 L50 40 L32 50 Z" fill="url(#rightFace)"/>

    <!-- Cube Edges Accent -->
    <path d="M32 14 L50 24 L32 34 L14 24 Z M32 34 L32 50 M14 24 L14 40 L32 50 L50 40 L50 24" 
          stroke="#7dd3fc" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- Precise Coordinate Axis Indicators -->
  <!-- X-Axis (Red) -->
  <line x1="32" y1="34" x2="44" y2="41" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
  <!-- Y-Axis (Green) -->
  <line x1="32" y1="34" x2="32" y2="20" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <!-- Z-Axis (Blue) -->
  <line x1="32" y1="34" x2="20" y2="41" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

  <!-- Center Pivot Dot -->
  <circle cx="32" cy="34" r="2" fill="#ffffff"/>
</svg>
